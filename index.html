<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Thiệp cảm ơn 💌</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #fff1f5, #ffe6ee);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.scene {
  width: 90vw;
  max-width: 360px;
  height: 540px;
  perspective: 1200px;
}

.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 1.1s ease;
  border-radius: 24px;
  box-shadow: 0 22px 50px rgba(0,0,0,0.25);
  background: white;
}

.card.flip {
  transform: rotateY(180deg);
}

.face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 22px;
  text-align: center;
}

/* FRONT */
.front img {
  width: 190px;
  height: 190px;
  object-fit: cover;
  border-radius: 50%;
  box-shadow: 0 10px 28px rgba(0,0,0,0.18);
}

.front h3 {
  margin-top: 18px;
  font-size: 18px;
  color: #ff4d6d;
}

.front p {
  margin-top: 8px;
  font-size: 14px;
  color: #777;
}

/* BACK */
.back {
  transform: rotateY(180deg);
}

.back h2 {
  font-size: 22px;
  color: #ff4d6d;
  margin-bottom: 10px;
}

.back strong {
  font-size: 20px;
}

.back p {
  font-size: 16px;
  color: #444;
  margin-top: 12px;
  line-height: 1.6;
}

/* HEART */
.heart {
  position: absolute;
  bottom: -20px;
  color: #ff4d6d;
  animation: floatUp linear forwards;
  opacity: 0.85;
}

@keyframes floatUp {
  to {
    transform: translateY(-120vh) scale(1.6);
    opacity: 0;
  }
}

/* SPARKLE */
.sparkle {
  position: absolute;
  font-size: 14px;
  animation: sparkle 1.4s ease forwards;
}

@keyframes sparkle {
  to {
    transform: translateY(-60px) scale(0.2);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <!-- MẶT TRƯỚC -->
    <div class="face front">
      <img src="girl.jpg" alt="Ảnh đại diện">
      <h3>A little thank you card 💌</h3>
      <p>Chạm để mở thiệp</p>
    </div>

    <!-- MẶT SAU -->
    <div class="face back">
      <h2>Cảm ơn món quà của bạn</h2>
      <strong>Uông Mỹ Thanh Tâm 💖</strong>

      <p>
        Mình thật sự rất vui khi nhận được món quà này.  
        Nhỏ thôi nhưng làm mình cười suốt cả ngày 😊  
        <br><br>
        Cảm ơn Thanh Tâm nhiều lắm  
        vì sự quan tâm nhẹ nhàng và đáng yêu này.  
        Thật sự là rất trân trọng 💕
      </p>
    </div>

  </div>
</div>

<!-- NHẠC NỀN -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const card = document.getElementById("card");
const music = document.getElementById("bgMusic");
let opened = false;

function createHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerText = "❤";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 14 + Math.random() * 20 + "px";
  h.style.animationDuration = 4 + Math.random() * 3 + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 7000);
}

function sparkle(x, y) {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.innerText = "✨";
  s.style.left = x + "px";
  s.style.top = y + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1500);
}

card.addEventListener("click", (e) => {
  card.classList.toggle("flip");

  if (!opened) {
    music.play().catch(()=>{});
    setInterval(createHeart, 400);
    opened = true;
  }

  sparkle(e.clientX, e.clientY);
});
</script>

</body>
</html>
